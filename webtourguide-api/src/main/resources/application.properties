spring.application.name=webtourguide-api
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/webtourguide_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Vidusew123@#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ddl-auto=update lets Hibernate adjust tables from your @Entity classes.
# Since you already ran the SQL script, switch to 'validate' once things are stable.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
app.jwt.secret=ChangeThisToALongRandomSecretStringAtLeast256BitsForHS256
app.jwt.expiration-ms=86400000

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads
